[project]
name = "metal-playlist-generator"
version = "0.1.0"
description = "A FastAPI-powered tool for generating metal playlists on Spotify based on subgenres."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.127.0",
    "python-dotenv>=1.2.1",
    "spotipy>=2.25.2",
    "jinja2>=3.1.4",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.9",
    "beautifulsoup4>=4.14.3",
    "requests>=2.32.5",
    "uvicorn>=0.40.0",
]
